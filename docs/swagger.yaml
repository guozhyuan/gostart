basePath: /
definitions:
  model.Base:
    description: 统一的 API 响应格式 ,响应成功的结果放在Data字段中;响应失败的结果放在Message字段中
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  model.LoginResp:
    properties:
      accessToken:
        type: string
      age:
        type: integer
      email:
        type: string
      id:
        type: integer
      refreshToken:
        type: string
      tmpTime:
        type: string
      username:
        type: string
    type: object
  model.UserResp:
    properties:
      age:
        type: integer
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: 这是一个用 Gin 框架集成的 Swagger 示例
  title: Gin + Swagger 示例 API
  version: "1.0"
paths:
  /api/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 登录
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 用户名
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/model.LoginResp'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/model.Base'
      summary: 登录
      tags:
      - 用户管理
  /api/logout:
    post:
      consumes:
      - application/json
      description: 登出
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            type: string
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/model.Base'
      summary: 登出
      tags:
      - 用户管理
  /api/regist:
    post:
      consumes:
      - application/json
      description: 创建用户
      parameters:
      - description: 用户名
        in: formData
        name: username
        required: true
        type: string
      - description: 用户密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/model.LoginResp'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/model.Base'
      summary: 创建用户
      tags:
      - 用户管理
  /api/user:
    get:
      consumes:
      - application/json
      description: 获取用户列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserResp'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Base'
      security:
      - ApiKeyAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
  /api/user/{id}:
    get:
      consumes:
      - application/json
      description: 获取单个用户
      parameters:
      - description: 用户id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResp'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.Base'
      security:
      - ApiKeyAuth: []
      summary: 获取单个用户
      tags:
      - 用户管理
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

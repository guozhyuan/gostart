# ============================================
# 负载均衡：定义后端服务器组
# ============================================
upstream backend_servers {
    # 负载均衡算法（默认轮询 round-robin）
    # 可选：least_conn（最少连接）、ip_hash（IP哈希）、random（随机）

    # 后端服务器列表
    server 172.31.96.1:9090 weight=5; # 权重5，处理更多请求

}

# https://chat.deepseek.com/share/yzxa6158w4ki4biq34 参考

server {
    listen 80;
    listen [::]:80;
    server_name 172.31.98.14; # 替换为你的实际域名

    # 所有 HTTP 请求重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}


# ============================================
# HTTP 服务器（80端口）
# ============================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 172.31.98.14; # 本地测试域名

    # ---------- SSL 证书配置 ----------
    # 证书路径（根据你的证书位置修改）
    ssl_certificate /etc/nginx/ssl/selfsigned.crt; # 证书文件
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key; # 私钥文件


    # SSL 协议和加密套件（安全强化）
    ssl_protocols TLSv1.2 TLSv1.3; # 只启用安全的 TLS 版本
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on; # 优先使用服务器端加密套件顺序

    # SSL 会话缓存（提升性能）
    ssl_session_cache shared:SSL:10m; # 共享缓存 10MB
    ssl_session_timeout 1d; # 会话超时时间
    ssl_session_tickets off; # 禁用 session ticket

    # HSTS（强制浏览器使用 HTTPS，防止 SSL 剥离攻击）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # ---------- 访问日志 ----------
    access_log /var/log/nginx/myapp.access.log;
    error_log /var/log/nginx/myapp.error.log;


    # ---------- 网站根目录（静态文件）----------
    root /var/www/gostart/public; # 前端静态文件根目录
    index index.html index.htm;

    # ========================================
    # 反向代理（转发到后端负载均衡组）
    # ========================================
    location / {
        # 转发请求到 upstream 负载均衡组
        proxy_pass http://backend_servers;

        # 代理请求头设置（传递真实客户端信息）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 支持 WebSocket（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ========================================
    # 限流配置（保护后端服务）
    # 注意：limit_req_zone 需要在 nginx.conf 的 http 块中定义
    # ========================================
    location /api/sensitive/ {
        # 使用限流（需在 nginx.conf 中定义 api_limit）
        # limit_req zone=api_limit burst=20 nodelay;
        # limit_conn conn_limit 10;

        # 代理转发
        # proxy_pass http://backend_servers;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================
    # 健康检查端点
    # ========================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========================================
    # 阻止访问隐藏文件
    # ========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
